    <script src="script.js"></script>
    <script>
      const projects = [
        {
          name: "Brick House Nutrition",
          url: "https://brickhousenutrition.com/",
          tag: "Nutrition Brand",
          technologies: ["Adobe Commerce", "JavaScript", "HTML", "CSS"],
          images: [
            { src: "assets/brickhouse-nutrition.png", alt: "Brick House Nutrition website preview" }
          ]
        },
        {
          name: "Birchbury",
          url: "https://birchbury.com/",
          tag: "Lifestyle Brand",
          technologies: ["Shopify", "HTML", "CSS", "JavaScript"],
          images: [
            { src: "assets/birchbury-collection.png", alt: "Birchbury barefoot shoes collection" },
            { src: "assets/birchbury-brand.png", alt: "Birchbury brand card" }
          ]
        },
        {
          name: "Once Again Home",
          url: "https://www.onceagainhome.com/",
          tag: "Retail & Home",
          technologies: ["Shopify", "Liquid", "JavaScript", "CSS"],
          images: [
            { src: "assets/once-again-home.png", alt: "Once Again Home website preview" }
          ]
        },
        {
          name: "Jaipur Living",
          url: "https://www.jaipurliving.com/",
          tag: "Home Décor",
          technologies: ["E-commerce", "JavaScript", "HTML", "CSS"],
          images: [
            { src: "assets/jaipur-living.png", alt: "Jaipur Living website preview" }
          ]
        },
        {
          name: "HON",
          url: "https://www.hon.com/",
          tag: "Office Solutions",
          images: [
            { src: "assets/hon.png", alt: "HON office furniture website preview" }
          ]
        },
        {
          name: "Allsteel",
          url: "https://www.allsteeloffice.com/",
          tag: "Office Furniture",
          images: [{ src: "assets/allsteel.png", alt: "Allsteel office furniture website preview" }]
        },
        {
          name: "Zooxae",
          url: "https://zooxae.com/",
          tag: "Consumer Brand",
          images: [{ src: "assets/zooxae.png", alt: "Zooxae aquatic plants website preview" }]
        },
        {
          name: "Dentalkart",
          url: "https://www.dentalkart.com/",
          tag: "Healthcare",
          images: [{ src: "assets/dentalkart.png", alt: "Dentalkart dental products website preview" }]
        },
        {
          name: "Asort",
          url: "https://asort.com/",
          tag: "Commerce Platform",
          images: [{ src: "assets/asort.png", alt: "Asort commerce platform website preview" }]
        },
        {
          name: "Ronati",
          url: "https://ronati.com/",
          tag: "Fashion Brand",
          images: [{ src: "assets/ronati.png", alt: "Ronati inventory platform website preview" }]
        },
        { name: "Vajor", url: "http://vajor.com/", tag: "Fashion & Lifestyle" },
        {
          name: "Healthstores",
          url: "https://healthstores.in/",
          tag: "Healthcare",
          images: [{ src: "assets/healthstores.png", alt: "Healthstores website preview" }]
        },
        {
          name: "Gullybaba",
          url: "https://www.gullybaba.com/",
          tag: "Digital Commerce",
          images: [{ src: "assets/gullybaba.png", alt: "Gullybaba website preview" }]
        },
        {
          name: "Victory Food",
          url: "https://www.victoryfood.net/",
          tag: "Food Brand",
          images: [{ src: "assets/victory-food.png", alt: "Victory Food website preview" }]
        },
        {
          name: "Disha Publication",
          url: "https://dishapublication.com/",
          tag: "Publishing",
          images: [{ src: "assets/disha-publication.png", alt: "Disha Publication website preview" }]
        },
        {
          name: "Indian Nuts",
          url: "https://www.indianuts.com/",
          tag: "Food & Retail",
          images: [{ src: "assets/indian-nuts.png", alt: "Indian Nuts website preview" }]
        },
        {
          name: "Pepperfry",
          url: "https://www.pepperfry.com/",
          tag: "Furniture & Lifestyle",
          images: [{ src: "assets/pepperfry.png", alt: "Pepperfry furniture website preview" }]
        }
      ];

      const projectGrid = document.getElementById("projectGrid");

      projects.forEach((project) => {
        const card = document.createElement("a");
        card.className = "project-card";
        card.href = project.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.setAttribute("aria-label", `Visit ${project.name}`);

        if (!project.images?.length) {
          card.classList.add("project-card-no-image");
        }

        const preview = project.images?.length
          ? `<span class="project-card-preview"><img class="project-card-image" src="${project.images[0].src}" alt="${project.images[0].alt || project.name}" /></span>`
          : "";

        card.innerHTML = `${preview}<h3>${project.name}</h3>`;

        card.querySelector(".project-card-image")?.addEventListener("error", (event) => {
          event.currentTarget.closest(".project-card-preview")?.remove();
          card.classList.add("project-card-no-image");
        });
        projectGrid.appendChild(card);
      });
    </script>
  </body>
</html>
